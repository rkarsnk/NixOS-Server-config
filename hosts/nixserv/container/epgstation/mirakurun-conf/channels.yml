# 大阪府(吹田市)向けチャンネル定義。
# 受信はアンテナではなくNTT西日本フレッツ・テレビ経由のため、中継局との位置関係(電波の
# 見通し)には左右されない。フレッツ・テレビ大阪エリアの地上波ラインナップ(公式サイトで確認)
# は下記8局のみで、奈良テレビ・びわ湖放送・京都放送・テレビ和歌山は大阪エリアには含まれない。
# 出典: https://flets-w.com/opt/ftv/terms/channel.html
#
# GR(地上波)は物理チャンネル番号のみ指定し、serviceIdは意図的に省略している。
# Mirakurunの仕様上、serviceId未指定のチャンネルは起動時/スキャン時に自動検出される
# (公式ドキュメント: "Services will be automatically scanned if not specified.")ため。
# 物理チャンネル番号の出典(フレッツ・テレビは地デジをパススルー配信するため送信所側の
# 物理チャンネルがそのまま使える): https://491mhz.net/soushinjo/osaka/ikomayama.html
#      https://bokunimo.net/bokunimowakaru/misc-ch.html
#
# BS/CSは全国共通。無料/主要有料チャンネルを網羅する形でMirakurun公式サンプルに
# WOWOW・スターチャンネル・J SPORTS・CS110全ジャンルなどを追加でマージしている。
# 出典: https://github.com/Chinachu/Mirakurun/blob/master/config/channels.yml
#       https://gist.github.com/Connie-Wild/877b48382139fc03282eb448827c6d4b (2025/09時点)
# WOWOWやCS110の有料チャンネルはスカパー!等の契約・カード登録がないとスクランブルされたまま
# (チャンネル自体は視聴の可否に関わらず一覧に含めている)。
#
# 実機で必ず以下を実行し、実際の受信状況(NID/TSID/serviceId)と一致しているか確認すること:
#   curl -X PUT "http://192.168.24.50:40772/api/config/channels/scan"
# 受信できないチャンネルがあれば isDisabled: true を追加するか削除する。

# --- 地上波(大阪) ---
- name: NHK総合・大阪
  type: GR
  channel: '24'

- name: NHK Eテレ・大阪
  type: GR
  channel: '13'

- name: 読売テレビ
  type: GR
  channel: '14'

- name: 朝日放送テレビ
  type: GR
  channel: '15'

- name: 毎日放送
  type: GR
  channel: '16'

- name: 関西テレビ
  type: GR
  channel: '17'

- name: テレビ大阪
  type: GR
  channel: '18'

# サンテレビ(兵庫県の独立局)。フレッツ・テレビの大阪エリアラインナップに含まれており
# 受信確実(物理チャンネルは生駒山中継局<1kW>の値)。
- name: サンテレビ
  type: GR
  channel: '26'

