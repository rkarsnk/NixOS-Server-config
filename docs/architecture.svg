<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Helvetica, Arial, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif">
  <rect x="0" y="0" width="640" height="480" fill="#ffffff"/>

  <!-- ホストOS -->
  <rect x="20" y="20" width="600" height="366" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="320" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">ホストOS: nixserv (NixOS)</text>

  <!-- Podmanコンテナ -->
  <rect x="50" y="68" width="540" height="160" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Podmanコンテナ (services.pvePodman)</text>
  <text x="320" y="101" text-anchor="middle" font-size="10" fill="#555555">eth0 = veth, br0のポート(IPなし)</text>
  <text x="320" y="114" text-anchor="middle" font-size="10" fill="#555555">Podman bridgeネットワーク (mode=unmanaged)</text>

  <!-- Proxmox VE (コンテナに入れ子) -->
  <rect x="65" y="124" width="510" height="95" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Proxmox VE</text>
  <text x="320" y="154" text-anchor="middle" font-size="10" fill="#555555">vmbr0 — IP: 192.168.24.51/24</text>

  <rect x="80" y="167" width="150" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="155" y="188" text-anchor="middle" font-size="11" fill="#000000">VM #1</text>

  <rect x="245" y="167" width="150" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="188" text-anchor="middle" font-size="11" fill="#000000">VM #2</text>

  <rect x="410" y="167" width="150" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="485" y="182" text-anchor="middle" font-size="11" fill="#000000">LXC</text>
  <text x="485" y="195" text-anchor="middle" font-size="9" fill="#555555">192.168.24.99</text>

  <!-- Podman層 -->
  <rect x="50" y="236" width="540" height="28" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="254" text-anchor="middle" font-size="12" fill="#000000">Podman</text>

  <!-- NixOS層(br0/enp1s0を入れ子で内包) -->
  <rect x="50" y="272" width="540" height="100" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="#000000">NixOS</text>

  <rect x="190" y="298" width="260" height="64" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">br0 (Linuxブリッジ)</text>
  <text x="320" y="331" text-anchor="middle" font-size="10" fill="#555555">enp1s0 = 物理NICポート</text>
  <text x="320" y="345" text-anchor="middle" font-size="10" fill="#555555">IP: 192.168.24.50/24</text>

  <!-- LAN -->
  <rect x="260" y="410" width="120" height="50" rx="25" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">LAN</text>
  <text x="320" y="445" text-anchor="middle" font-size="10" fill="#555555">192.168.24.0/24</text>

  <!-- LAN -> br0(enp1s0)への矢印 -->
  <line x1="320" y1="410" x2="320" y2="376" stroke="#000000" stroke-width="1.5"/>
  <polygon points="320,366 314,378 326,378" fill="#000000"/>
</svg>
