<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="Helvetica, Arial, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif">
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>

  <!-- ホストOS -->
  <rect x="20" y="20" width="600" height="310" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="320" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">ホストOS: nixserv (NixOS)</text>
  <text x="320" y="54" text-anchor="middle" font-size="11" fill="#555555">enp1s0 = 192.168.24.50</text>

  <!-- Podmanコンテナ -->
  <rect x="50" y="70" width="540" height="150" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Podmanコンテナ (services.pvePodman)</text>
  <text x="320" y="103" text-anchor="middle" font-size="11" fill="#555555">macvlan IP: 192.168.24.51</text>

  <!-- Proxmox VE (コンテナに入れ子) -->
  <rect x="65" y="112" width="510" height="95" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Proxmox VE</text>
  <text x="320" y="142" text-anchor="middle" font-size="10" fill="#555555">vmbr0 でLANにブリッジ</text>

  <rect x="170" y="155" width="140" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="240" y="176" text-anchor="middle" font-size="11" fill="#000000">VM #1</text>

  <rect x="330" y="155" width="140" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="176" text-anchor="middle" font-size="11" fill="#000000">VM #2</text>

  <!-- Podman層 -->
  <rect x="50" y="235" width="540" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="254" text-anchor="middle" font-size="12" fill="#000000">Podman</text>

  <!-- NixOS層 -->
  <rect x="50" y="280" width="540" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="299" text-anchor="middle" font-size="12" fill="#000000">NixOS</text>

  <!-- LAN -->
  <rect x="260" y="370" width="120" height="50" rx="25" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">LAN</text>
  <text x="320" y="405" text-anchor="middle" font-size="10" fill="#555555">192.168.24.0/24</text>

  <!-- LAN -> ホストOS への矢印 -->
  <line x1="320" y1="370" x2="320" y2="340" stroke="#000000" stroke-width="1.5"/>
  <polygon points="320,330 314,342 326,342" fill="#000000"/>
  <text x="332" y="352" font-size="10" fill="#555555">enp1s0 (物理NIC)</text>
</svg>
